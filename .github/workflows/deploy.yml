name: GreenLens CI/CD

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v3

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-django

      - name: Run Pytest with Coverage
        # Fails if coverage drops below 60%
        env:
          DJANGO_SETTINGS_MODULE: greenlens.sqlite_settings
        run: |
          pytest --cov=. --cov-fail-under=60 --verbose

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v3

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Linting Libraries
        run: |
          pip install flake8 black

      - name: Run Black Formatter Check
        run: |
          black --check . || true

      - name: Run Flake8 Code Linter
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

  deploy:
    runs-on: ubuntu-latest
    needs: [test, lint]
    steps:
      - name: Trigger Render Deployment
        uses: curl/curl@v1.0
        with:
          args: -X POST ${{ secrets.RENDER_DEPLOY_HOOK }}
