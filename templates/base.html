<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}GreenLens{% endblock %}</title>
  <meta name="og:title" content="{% block og_title %}GreenLens — Climate Risk Intelligence{% endblock %}" />
  <meta name="description" content="Satellite-verified climate risk scoring system for green bonds." />

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <!-- Leaflet.js -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

  <style>
    :root {
      --primary-green: #1D9E75;
      --dark-bg: #0d1117;
      --card-bg: #161b22;
      --border-color: #30363d;
      --text-muted: #8b949e;
    }
    * { font-family: 'Inter', system-ui, -apple-system, sans-serif; }
    body { background: var(--dark-bg); color: #e6edf3; margin: 0; }
    .navbar { background: #161b22 !important; border-bottom: 1px solid var(--border-color); padding: 0.6rem 1.5rem; }
    .navbar-brand { font-weight: 700; color: var(--primary-green) !important; font-size: 1.2rem; text-decoration: none; }
    .navbar-brand:hover { color: #3fb950 !important; }
    .nav-link { color: #8b949e !important; font-weight: 500; transition: color 0.2s; }
    .nav-link:hover, .nav-link.active { color: var(--primary-green) !important; }
    .stat-card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 8px; padding: 1.5rem; }
    .stat-card .label { font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 0.25rem; }
    .stat-card .value { font-size: 2rem; font-weight: 700; color: var(--primary-green); }
    #map { height: 520px; border-radius: 8px; border: 1px solid var(--border-color); }
    .container-page { padding: 1.5rem; max-width: 100%; }
  </style>
  {% block extra_head %}{% endblock %}
  {% block extra_css %}{% endblock %}
</head>
<body>

<nav class="navbar navbar-expand-lg">
  <a class="navbar-brand" href="{% url 'dashboard:index' %}">🌿 GreenLens</a>
  <div class="collapse navbar-collapse" id="navbarContent">
    <ul class="navbar-nav ms-auto">
      <li class="nav-item">
        <a class="nav-link {% if request.resolver_match.url_name == 'index' %}active{% endif %}" href="{% url 'dashboard:index' %}">🗺 Map</a>
      </li>
      <li class="nav-item">
        <a class="nav-link {% if request.resolver_match.url_name == 'pricing_analysis' %}active{% endif %}" href="{% url 'dashboard:pricing_analysis' %}">📊 Pricing</a>
      </li>
      <li class="nav-item">
        <a class="nav-link {% if request.resolver_match.url_name == 'about' %}active{% endif %}" href="{% url 'dashboard:about' %}">ℹ About</a>
      </li>
      <li class="nav-item">
        <a class="nav-link {% if request.resolver_match.url_name == 'terms' %}active{% endif %}" href="{% url 'dashboard:terms' %}">📜 Terms</a>
      </li>
    </ul>
  </div>
  <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent">
    <span class="navbar-toggler-icon"></span>
  </button>
</nav>

<div id="page-content">
  {% block content %}{% endblock %}
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
{% block extra_js %}{% endblock %}
</body>
</html>
