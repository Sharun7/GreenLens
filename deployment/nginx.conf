# GreenLens Nginx Load Balancer Configuration
# For scaling to 1 lakh bonds with multiple Django workers

upstream greenlens_backend {
    # Load balancing across multiple Django workers
    # Add more servers as needed for horizontal scaling
    server web1:8000 weight=1 max_fails=3 fail_timeout=30s;
    server web2:8000 weight=1 max_fails=3 fail_timeout=30s;
    # server web3:8000 weight=1 max_fails=3 fail_timeout=30s;
    
    # Least connections algorithm for better distribution
    least_conn;
    
    # Keep alive connections for performance
    keepalive 32;
}

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/m;
limit_req_zone $binary_remote_addr zone=general_limit:10m rate=300r/m;

# Cache zones
proxy_cache_path /var/cache/nginx/greenlens levels=1:2 keys_zone=greenlens_cache:100m max_size=1g inactive=60m use_temp_path=off;

server {
    listen 80;
    server_name greenlens.io www.greenlens.io;
    
    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    
    # Client body size limit (for file uploads)
    client_max_body_size 10M;
    
    # Timeouts
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
    
    # Static files (served directly by Nginx)
    location /static/ {
        alias /app/staticfiles/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
    
    location /media/ {
        alias /app/media/;
        expires 30d;
        add_header Cache-Control "public";
    }
    
    # API endpoints with rate limiting
    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;
        
        proxy_pass http://greenlens_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Enable caching for GET requests
        proxy_cache greenlens_cache;
        proxy_cache_valid 200 5m;
        proxy_cache_valid 404 1m;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;
        proxy_cache_lock on;
        
        add_header X-Cache-Status $upstream_cache_status;
    }
    
    # Dashboard and web pages
    location / {
        limit_req zone=general_limit burst=50 nodelay;
        
        proxy_pass http://greenlens_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Cache HTML pages briefly
        proxy_cache greenlens_cache;
        proxy_cache_valid 200 2m;
        proxy_cache_bypass $http_cache_control;
        
        add_header X-Cache-Status $upstream_cache_status;
    }
    
    # Health check endpoint (no rate limiting)
    location /health/ {
        proxy_pass http://greenlens_backend;
        access_log off;
    }
    
    # Deny access to sensitive files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}

